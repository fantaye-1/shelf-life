spring:
  application:
    name: shelf-life-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/shelflife}
    username: ${DATABASE_USERNAME:shelflife}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Don't reveal component details to anonymous callers.
      show-details: never
